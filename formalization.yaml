version: v0.4
project:
  name: "Single-copy group constructions cannot refute the Set Cover Conjecture"
  description: >-
    Pratt (STOC 2024, arXiv:2311.02774, Corollary 1.12) showed that if the Set Cover Conjecture holds,
    then for every k the asymptotic rank of the balanced tripartitioning tensor T_k is at least
    tau_k = 8^k * C(3k,k) * C(2k,k) / 27^k. A natural way to bound this rank, and Pratt's own route to
    rank at most 8^k/2, is a group construction: maps f1, f2, f3 from k-subsets of a 3k-set to a group G
    with f1(A) f2(B) f3(C) = 1 exactly when A, B, C are pairwise disjoint (a partition analogue of the
    Cohn-Umans triple product property). We formalise that no such construction, in any finite group,
    abelian or not, can refute the conjecture: |G| > tau_k for every k >= 2. The same holds for Strassen
    combinatorial degenerations of group tensors (border-rank constructions), via |G| >= C(3k, floor(3k/2)) > tau_k. The proof formalises a
    rigidity theorem: the triple products always factor through pairwise commuting elements,
    f1(A) f2(B) f3(C) = prod_i g_i^(m_i - 1) with m the multiplicity vector, so non-abelian groups give no
    advantage, unlike in the Cohn-Umans approach to matrix multiplication. It also formalises a lift
    lemma giving |G| >= 2^(3k-1), which shows Pratt's 8^k/2 is exactly optimal among group
    restrictions. Pratt's Corollary 1.12 and the passage from a group embedding to a rank bound are
    cited, not formalised. The bounds concern the group size needed by such constructions, not the rank
    of T_k itself, and only constructions for a single copy of T_k; joint constructions for tensor powers,
    which govern asymptotic rank, are not covered.
  authors: ["Eyal Merhavi"]
  responsible_maintainers: ["Eyal Merhavi"]
  license: Apache-2.0
